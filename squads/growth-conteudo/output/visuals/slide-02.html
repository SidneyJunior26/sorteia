<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 2 — Antes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1440px; overflow: hidden;
    background: #F7F3EC;
    font-family: 'Poppins', sans-serif;
    display: flex; flex-direction: column;
    justify-content: center; align-items: flex-start;
    padding: 80px;
  }
  .label {
    font-size: 28px; font-weight: 700; color: #FF6B4A;
    letter-spacing: 2px; margin-bottom: 24px;
  }
  .heading {
    font-size: 48px; font-weight: 700; color: #201C2B;
    line-height: 1.25; max-width: 920px; margin-bottom: 48px;
  }
  .body-text {
    font-size: 38px; font-weight: 600; color: #201C2B;
    line-height: 1.5; max-width: 920px;
  }
  .body-text .accent { color: #FF6B4A; }
  .step-tag {
    position: absolute; bottom: 64px; left: 80px;
    font-size: 28px; font-weight: 600; color: rgba(32,28,43,0.55);
  }
  .wrap { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="label">ANTES</span>
    <h2 class="heading">O QUE EU ESPERAVA</h2>
    <p class="body-text">Toquei em "Sortear livro" já torcendo pra cair alguma coisa segura: um clássico manjado ou best-seller que todo mundo já indicou. Categoria em mente, <span class="accent">expectativa baixa</span>. Achei que ia bater aquele "ah, de novo isso".</p>
    <span class="step-tag">achei meu livro 🎲</span>
  </div>
</body>
</html>
