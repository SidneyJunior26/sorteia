<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 5 — CTA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1440px; overflow: hidden;
    background: #FF6B4A;
    font-family: 'Poppins', sans-serif;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 80px;
  }
  .dice {
    font-size: 96px;
    margin-bottom: 48px;
    line-height: 1;
  }
  .heading {
    font-size: 50px; font-weight: 800; color: #201C2B;
    text-align: center; line-height: 1.3;
    max-width: 900px; margin-bottom: 40px;
  }
  .caption {
    font-size: 30px; font-weight: 600; color: rgba(32,28,43,0.8);
    text-align: center; max-width: 800px; line-height: 1.5;
  }
  .tag {
    position: absolute; top: 80px; left: 80px;
    font-size: 28px; font-weight: 700; color: rgba(32,28,43,0.65);
    letter-spacing: 1px;
  }
  .wrap { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="tag">ACHEI MEU LIVRO</span>
    <span class="dice">🎲</span>
    <h2 class="heading">Salva esse carrossel e testa o seu.</h2>
    <p class="caption">Comenta aqui embaixo o que caiu pra você.</p>
  </div>
</body>
</html>
